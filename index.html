<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SUPER OFF ROAD '94</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0a12; touch-action:none; }
  body { font-family:"Courier New", ui-monospace, monospace; color:#fff; }

  #game {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    image-rendering:pixelated; image-rendering:crisp-edges;
    background:#000;
  }

  /* ---------- Screens ---------- */
  .screen {
    position:fixed; inset:0; display:none; z-index:20;
    flex-direction:column; align-items:center; justify-content:center;
    background:rgba(5,5,15,.72); text-align:center; padding:12px;
  }
  .screen.on { display:flex; }
  .title-big {
    font-size:clamp(26px,7vw,64px); font-weight:bold; letter-spacing:3px; line-height:1.05;
    color:#ffd23c;
    text-shadow:0 3px 0 #b3541e, 0 6px 0 #5c1d0e, 0 8px 14px #000;
    transform:skewX(-6deg);
  }
  .title-sub { color:#7ee8ff; margin-top:8px; font-size:clamp(11px,2.2vw,18px); letter-spacing:2px; text-shadow:0 2px 0 #000; }
  .btn {
    display:inline-block; margin:8px; padding:12px 26px; cursor:pointer;
    font-family:inherit; font-weight:bold; font-size:clamp(13px,2.4vw,20px); letter-spacing:2px;
    color:#fff; background:linear-gradient(#e8542f,#a32310); border:3px solid #ffd23c;
    border-radius:6px; box-shadow:0 4px 0 #5c1d0e, 0 6px 12px rgba(0,0,0,.6);
    text-shadow:0 2px 0 rgba(0,0,0,.5);
  }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #5c1d0e; }
  .btn.alt { background:linear-gradient(#3a7bd5,#1f3f8f); border-color:#9fd8ff; box-shadow:0 4px 0 #122451, 0 6px 12px rgba(0,0,0,.6); }
  .btn.small { padding:7px 14px; font-size:clamp(11px,1.8vw,14px); }
  .btn[disabled] { filter:grayscale(.9) brightness(.6); pointer-events:none; }
  .hint { color:#9aa3b8; font-size:clamp(10px,1.8vw,13px); margin-top:14px; letter-spacing:1px; }

  /* ---------- Car select ---------- */
  #carRow { display:flex; gap:14px; margin:18px 0; flex-wrap:wrap; justify-content:center; }
  .carCard {
    width:clamp(140px,22vw,200px); padding:10px; cursor:pointer;
    background:#141a2c; border:3px solid #2c3a5e; border-radius:8px;
  }
  .carCard.sel { border-color:#ffd23c; background:#23304e; box-shadow:0 0 16px rgba(255,210,60,.5); }
  .carCard h3 { color:#ffd23c; letter-spacing:2px; font-size:clamp(13px,2vw,17px); margin-bottom:6px; }
  .carCard canvas { width:80px; height:60px; image-rendering:pixelated; }
  .statRow { display:flex; align-items:center; gap:6px; margin:3px 0; font-size:clamp(9px,1.4vw,11px); color:#9fd8ff; }
  .statRow b { width:34px; text-align:left; }
  .pips { display:flex; gap:2px; }
  .pip { width:10px; height:8px; background:#222b44; border:1px solid #000; }
  .pip.f { background:#48e06a; }

  /* ---------- Results / Shop ---------- */
  .panel {
    background:#10162a; border:3px solid #ffd23c; border-radius:10px;
    padding:clamp(10px,2vw,22px); min-width:min(92vw,560px); max-height:88vh; overflow-y:auto;
  }
  .panel h2 { color:#ffd23c; letter-spacing:3px; font-size:clamp(16px,3vw,26px); margin-bottom:10px; text-shadow:0 2px 0 #000; }
  table.res { width:100%; border-collapse:collapse; font-size:clamp(11px,2vw,16px); }
  table.res td { padding:5px 8px; border-bottom:1px solid #2c3a5e; text-align:left; }
  table.res tr.me td { color:#ffd23c; font-weight:bold; }
  .money { color:#48e06a; font-weight:bold; }
  .upRow { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:8px 0; padding:8px; background:#182039; border-radius:6px; }
  .upRow .nm { font-weight:bold; color:#9fd8ff; letter-spacing:1px; font-size:clamp(11px,2vw,15px); width:96px; text-align:left; }

  /* ---------- Touch controls ---------- */
  #touchUI { position:fixed; inset:0; z-index:10; display:none; pointer-events:none; }
  #touchUI.on { display:block; }
  #wheelZone { position:absolute; left:0; bottom:0; width:46%; height:64%; pointer-events:auto; }
  #wheel {
    position:absolute; left:22px; bottom:20px; width:160px; height:160px; border-radius:50%;
    border:16px solid #2c2c34;
    background:radial-gradient(circle, rgba(255,255,255,.10) 0%, rgba(255,255,255,.03) 65%);
    box-shadow:0 0 0 3px #555, 0 0 0 3px #555 inset, 0 6px 16px rgba(0,0,0,.6);
    transition:transform .08s linear; will-change:transform;
  }
  #wheel .spoke {
    position:absolute; left:50%; top:50%; width:14px; height:64px;
    background:linear-gradient(#4a4a56, #2c2c34); border-radius:7px;
    transform-origin:50% 0;
  }
  #wheel .s1 { transform:translate(-50%,0) rotate(0deg); }
  #wheel .s2 { transform:translate(-50%,0) rotate(120deg); }
  #wheel .s3 { transform:translate(-50%,0) rotate(240deg); }
  #wheel .hub {
    position:absolute; left:50%; top:50%; width:46px; height:46px; border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%, #ffe88a, #ffd23c 55%, #c8801e);
    border:3px solid #8a5a14;
  }
  #wheel .mark {
    position:absolute; left:50%; top:-13px; width:10px; height:14px;
    transform:translateX(-50%); background:#e8302a; border-radius:3px;
  }
  .tbtn {
    position:absolute; pointer-events:auto; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:bold; letter-spacing:1px; color:#fff; text-shadow:0 2px 2px #000;
    border:3px solid rgba(255,255,255,.6); opacity:.92;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
  }
  .tbtn.press { filter:brightness(1.6); transform:scale(.94); }
  #btnGas   { right:16px;  bottom:16px;  width:104px; height:104px; background:radial-gradient(circle at 35% 30%, rgba(90,230,130,.8), rgba(20,140,60,.7)); font-size:17px; }
  #btnBrake { right:136px; bottom:14px;  width:74px;  height:74px;  background:radial-gradient(circle at 35% 30%, rgba(255,110,90,.8), rgba(170,40,25,.7)); font-size:13px; }
  #btnNitro { right:28px;  bottom:138px; width:88px;  height:88px;  background:radial-gradient(circle at 35% 30%, rgba(120,190,255,.85), rgba(30,90,200,.75)); font-size:14px; }

  #muteBtn, #pauseBtn, #homeBtn {
    position:fixed; top:6px; z-index:30; pointer-events:auto;
    background:rgba(0,0,0,.45); color:#fff; border:2px solid #555; border-radius:6px;
    font-size:16px; padding:4px 10px; cursor:pointer; font-family:inherit;
  }
  #muteBtn { right:8px; }
  #pauseBtn { left:8px; display:none; }
  #pauseBtn.on { display:block; }
  #homeBtn { left:8px; top:48px; display:none; }
  #homeBtn.on { display:block; }

  /* ---------- Rotate notice ---------- */
  #rotate {
    position:fixed; inset:0; z-index:99; display:none; flex-direction:column;
    align-items:center; justify-content:center; background:#0a0a12; gap:14px;
  }
  #rotate .ph { font-size:60px; animation:spinPh 1.6s ease-in-out infinite; }
  @keyframes spinPh { 0%,20%{transform:rotate(0)} 60%,100%{transform:rotate(90deg)} }
  @media (orientation:portrait) and (pointer:coarse) { #rotate { display:flex; } }
</style>
</head>
<body>

<canvas id="game" width="1280" height="720"></canvas>
<button id="muteBtn">🔊</button>

<!-- Touch controls -->
<div id="touchUI">
  <div id="wheelZone">
    <div id="wheel">
      <div class="spoke s1"></div><div class="spoke s2"></div><div class="spoke s3"></div>
      <div class="mark"></div><div class="hub"></div>

<!-- Pause -->
<div class="screen" id="scrPause">

<!-- Title -->
<div class="screen on" id="scrTitle">
  <div class="title-big">SUPER<br>OFF ROAD '94</div>

  <div style="margin-top:26px">
    <button class="btn" id="bNew">NUEVA PARTIDA</button>

  </div>

  <div class="hint">TECLADO: ←→↑↓ / WASD · NITRO: ESPACIO · PAUSA: P<br>MÓVIL: ARRASTRA EL VOLANTE PARA GIRAR + BOTONES GAS / FRENO / NITRO</div>
</div>

<!-- Car select -->
<div class="screen" id="scrCars">
  <h2 style="color:#ffd23c;letter-spacing:3px;font-size:clamp(16px,3.4vw,28px);text-shadow:0 2px 0 #000">ELIGE TU MÁQUINA</h2>
  <div id="carRow"></div>
  <div>
    <button class="btn" id="bRace">¡A CORRER!</button>
    <button class="btn alt small" id="bMenuCars">← MENÚ</button>
  </div>
</div>

<!-- Results -->
<div class="screen" id="scrResults">
  <div class="panel">
    <h2 id="resTitle">RESULTADOS</h2>
    <table class="res" id="resTable"></table>
    <div style="margin-top:12px;font-size:clamp(12px,2vw,16px)">CARTERA: <span class="money" id="resMoney"></span></div>
    <button class="btn" id="bShop" style="margin-top:12px">TALLER DE MEJORAS →</button>
    <button class="btn alt small" id="bMenuRes" style="margin-top:12px">MENÚ PRINCIPAL</button>
  </div>
</div>

<!-- Shop -->
<div class="screen" id="scrShop">
  <div class="panel">
    <h2>🔧 TALLER</h2>
    <div style="font-size:clamp(12px,2vw,16px);margin-bottom:8px">DINERO: <span class="money" id="shopMoney"></span></div>
    <div id="upgrades"></div>
    <button class="btn" id="bNext" style="margin-top:10px">SIGUIENTE CARRERA →</button>
    <button class="btn alt small" id="bMenuShop" style="margin-top:10px">MENÚ PRINCIPAL</button>
  </div>
</div>

<div id="rotate"><div class="ph">📱</div><div style="letter-spacing:2px">GIRA TU DISPOSITIVO<br>PARA JUGAR</div></div>

<script>
'use strict';
/* ============================================================
   SUPER OFF ROAD '94 — juego arcade top-down en un solo HTML
   ============================================================ */

/* ---------------- Utils ---------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const hyp = Math.hypot;
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function smoothLoop(pts, seg) {
  const out = [], n = pts.length;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    for (let t = 0; t < seg; t++) {
      const u = t / seg, u2 = u * u, u3 = u2 * u;
      out.push({
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * u + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * u2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * u3),
        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * u + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * u2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * u3)
      });
    }
  }
  return out;
}
const vib = p => { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} };
const fmtTime = t => {
  if (t == null) return '--:--.-';
  const m = Math.floor(t / 60), s = Math.floor(t % 60), d = Math.floor((t % 1) * 10);
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s + '.' + d;
};

/* ---------------- Guardado ---------------- */
const SAVE_KEY = 'sor94_save';
const defaultSave = () => ({ money: 0, up: { vel: 0, acc: 0, nit: 0 }, race: 0, car: 0, best: {} });
const Store = {
  load() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.up) return s; } catch (e) {} return null; },
  save(s) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {} },
  wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
};

/* ---------------- Audio (Web Audio API) ---------------- */
const AudioFX = {
  ctx: null, master: null, muted: false,
  eng: null, engGain: null, nitGain: null, nitSrc: null, noiseBuf: null,
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.6;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 0.5, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  setMute(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.6; },
  startEngine() {
    if (!this.ctx || this.eng) return;
    const o1 = this.ctx.createOscillator(), o2 = this.ctx.createOscillator();
    o1.type = 'sawtooth'; o2.type = 'square'; o2.detune.value = 14;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    const g = this.ctx.createGain(); g.gain.value = 0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.master);
    o1.start(); o2.start();
    this.eng = [o1, o2]; this.engGain = g;
    // bucle de nitro (ruido filtrado)
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 1.2;
    const ng = this.ctx.createGain(); ng.gain.value = 0;
    src.connect(bp); bp.connect(ng); ng.connect(this.master); src.start();
    this.nitSrc = src; this.nitGain = ng;
    // bucle de derrape (chirrido de ruedas)
    const sk = this.ctx.createBufferSource(); sk.buffer = this.noiseBuf; sk.loop = true;
    const hp = this.ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 950;
    const sg = this.ctx.createGain(); sg.gain.value = 0;
    sk.connect(hp); hp.connect(sg); sg.connect(this.master); sk.start();
    this.skidSrc = sk; this.skidGain = sg;
  },
  stopEngine() {
    if (!this.eng) return;
    try { this.eng[0].stop(); this.eng[1].stop(); this.nitSrc.stop(); this.skidSrc.stop(); } catch (e) {}
    this.eng = null; this.engGain = null; this.nitSrc = null; this.nitGain = null;
    this.skidSrc = null; this.skidGain = null;
  },
  skid(level) {
    if (this.skidGain) this.skidGain.gain.setTargetAtTime(level * 0.10, this.ctx.currentTime, 0.06);
  },
  engine(speedRatio, nitro) {
    if (!this.eng) return;
    const f = 55 + speedRatio * 110 + (nitro ? 45 : 0);
    this.eng[0].frequency.setTargetAtTime(f, this.ctx.currentTime, 0.05);
    this.eng[1].frequency.setTargetAtTime(f * 0.5, this.ctx.currentTime, 0.05);
    this.engGain.gain.setTargetAtTime(0.05 + speedRatio * 0.06, this.ctx.currentTime, 0.08);
    this.nitGain.gain.setTargetAtTime(nitro ? 0.12 : 0, this.ctx.currentTime, 0.05);
  },
  beep(freq, dur, vol) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.value = vol || 0.18;
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    o.connect(g); g.connect(this.master);
    o.start(); o.stop(this.ctx.currentTime + dur);
  },
  burst(vol, dur, filt) { // golpes / splash
    if (!this.ctx) return;
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filt;
    const g = this.ctx.createGain(); g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(); src.stop(this.ctx.currentTime + dur);
  },
  crash() { this.burst(0.35, 0.25, 900); },
  splash() { this.burst(0.2, 0.3, 2400); },
  pickup() { this.beep(990, 0.09, 0.16); setTimeout(() => this.beep(1480, 0.14, 0.16), 70); },
  coin() { this.beep(1320, 0.08, 0.16); setTimeout(() => this.beep(1760, 0.16, 0.16), 60); },
  jingle() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.beep(f, 0.25, 0.2), i * 140));
  }
};

/* ---------------- Input ---------------- */
const Input = {
  keys: {}, tGas: false, tBrake: false, tNitro: false,
  tSteer: 0,                        // volante táctil (-1..1)
  steer: 0, gas: false, brake: false, nitro: false,
  init() {
    addEventListener('keydown', e => {
      this.keys[e.code] = true;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
      AudioFX.unlock();
    });
    addEventListener('keyup', e => { this.keys[e.code] = false; });
    addEventListener('pointerdown', () => AudioFX.unlock(), { passive: true });

    // botones táctiles
    const bind = (id, prop) => {
      const el = document.getElementById(id);
      const on = e => { e.preventDefault(); this[prop] = true; el.classList.add('press'); };
      const off = e => { e.preventDefault(); this[prop] = false; el.classList.remove('press'); };
      el.addEventListener('pointerdown', on);
      el.addEventListener('pointerup', off);
      el.addEventListener('pointercancel', off);
      el.addEventListener('pointerleave', off);
    };
    bind('btnGas', 'tGas'); bind('btnBrake', 'tBrake'); bind('btnNitro', 'tNitro');

    // volante táctil: arrastra a izquierda/derecha para girar
    const zone = document.getElementById('wheelZone');
    const wheel = document.getElementById('wheel');
    const RANGE = 80;             // píxeles de arrastre para giro máximo
    const DEAD = 0.06;            // zona muerta para ir recto sin esfuerzo
    let wId = null, sx = 0;
    const setWheel = x => {
      let v = clamp((x - sx) / RANGE, -1, 1);
      if (Math.abs(v) < DEAD) v = 0;
      this.tSteer = v;
      wheel.style.transform = `rotate(${v * 120}deg)`;
    };
    zone.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (wId !== null) return;
      wId = e.pointerId;
      sx = e.clientX - this.tSteer * RANGE;  // continúa desde el giro actual
      zone.setPointerCapture(e.pointerId);
      setWheel(e.clientX);
    });
    zone.addEventListener('pointermove', e => {
      if (e.pointerId !== wId) return;
      setWheel(e.clientX);
    });
    const wEnd = e => {
      if (e.pointerId !== wId) return;
      wId = null; this.tSteer = 0;
      wheel.style.transform = 'rotate(0deg)';   // auto-centrado
    };
    zone.addEventListener('pointerup', wEnd);
    zone.addEventListener('pointercancel', wEnd);
  },
  update() {
    const k = this.keys;
    let s = 0, gGas = false, gBrake = false, gNitro = false, gSteer = 0;
    // gamepad: stick izq./cruceta + A gas, B/LT freno, X/RT nitro
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const gp of pads) {
      if (!gp || !gp.connected) continue;
      const ax = gp.axes[0] || 0;
      if (Math.abs(ax) > 0.18) gSteer = ax;
      if (gp.buttons[14] && gp.buttons[14].pressed) gSteer = -1;
      if (gp.buttons[15] && gp.buttons[15].pressed) gSteer = 1;
      const b = i => gp.buttons[i] && gp.buttons[i].pressed;
      gGas = b(0) || b(7);
      gBrake = b(1) || b(6);
      gNitro = b(2) || b(5);
      break;
    }
    if (k['ArrowLeft'] || k['KeyA']) s -= 1;
    if (k['ArrowRight'] || k['KeyD']) s += 1;
    this.steer = s !== 0 ? s : (gSteer !== 0 ? gSteer : this.tSteer);
    this.gas = !!(k['ArrowUp'] || k['KeyW'] || this.tGas || gGas);
    this.brake = !!(k['ArrowDown'] || k['KeyS'] || this.tBrake || gBrake);
    this.nitro = !!(k['Space'] || k['ShiftLeft'] || k['ShiftRight'] || this.tNitro || gNitro);
  }
};

/* ---------------- Pista ---------------- */
class Track {
  constructor(def) {
    this.def = def;
    this.pts = smoothLoop(def.pts, 14);
    this.n = this.pts.length;
    this.halfW = def.width / 2;
    this.normals = [];
    for (let i = 0; i < this.n; i++) {
      const a = this.pts[(i - 1 + this.n) % this.n], b = this.pts[(i + 1) % this.n];
      const tx = b.x - a.x, ty = b.y - a.y, l = hyp(tx, ty) || 1;
      this.normals.push({ x: -ty / l, y: tx / l, tx: tx / l, ty: ty / l });
    }
    this.obstacles = this.placeObstacles();
    this.canvas = this.render();
  }
  placeObstacles() {
    const rng = mulberry32(this.def.seed * 999 + 7);
    const list = [], types = this.def.obstacles;
    for (let i = 0; i < types.length; i++) {
      const idx = Math.floor(this.n * (0.14 + 0.78 * (i / types.length)) + rng() * 8);
      const p = this.pts[idx % this.n], nrm = this.normals[idx % this.n];
      const off = (rng() * 2 - 1) * this.halfW * 0.45;
      const t = types[i];
      list.push({
        type: t,
        x: p.x + nrm.x * off, y: p.y + nrm.y * off,
        r: t === 'tires' ? 16 : (t === 'bump' ? 15 : 26)
      });
    }
    return list;
  }
  render() {
    const d = this.def, cv = document.createElement('canvas');
    cv.width = 1280; cv.height = 720;
    const c = cv.getContext('2d');
    const rng = mulberry32(d.seed);
    // fondo
    c.fillStyle = d.bg; c.fillRect(0, 0, 1280, 720);
    for (let i = 0; i < 420; i++) { // textura de fondo
      c.fillStyle = rng() < 0.5 ? d.deco : 'rgba(0,0,0,0.08)';
      c.fillRect((rng() * 1280) | 0, (rng() * 720) | 0, 3, 3);
    }
    // decoración exterior (cactus / rocas / pinos)
    for (let i = 0; i < 46; i++) {
      const x = rng() * 1280, y = rng() * 720;
      let ok = true;
      for (let j = 0; j < this.n; j += 4) {
        const dx = x - this.pts[j].x, dy = y - this.pts[j].y;
        if (dx * dx + dy * dy < (this.halfW + 42) * (this.halfW + 42)) { ok = false; break; }
      }
      if (!ok) continue;
      if (d.theme === 'desert') { // cactus
        c.fillStyle = '#3f7a2e';
        c.fillRect(x - 3, y - 16, 6, 18); c.fillRect(x - 10, y - 10, 7, 4); c.fillRect(x + 3, y - 13, 7, 4);
        c.fillRect(x - 10, y - 16, 4, 8); c.fillRect(x + 6, y - 19, 4, 8);
      } else if (d.theme === 'snow') { // pino nevado
        c.fillStyle = '#1f4d33';
        c.beginPath(); c.moveTo(x, y - 22); c.lineTo(x + 11, y); c.lineTo(x - 11, y); c.fill();
        c.fillStyle = '#fff'; c.fillRect(x - 6, y - 9, 12, 3);
      } else { // roca
        c.fillStyle = '#4a3417';
        c.beginPath(); c.arc(x, y, 6 + rng() * 5, 0, TAU); c.fill();
        c.fillStyle = 'rgba(255,255,255,0.15)'; c.fillRect(x - 3, y - 4, 4, 2);
      }
    }
    // calzada
    const path = new Path2D();
    path.moveTo(this.pts[0].x, this.pts[0].y);
    for (let i = 1; i < this.n; i++) path.lineTo(this.pts[i].x, this.pts[i].y);
    path.closePath();
    c.lineJoin = 'round'; c.lineCap = 'round';
    c.strokeStyle = d.border; c.lineWidth = d.width + 18; c.stroke(path);
    c.strokeStyle = d.road; c.lineWidth = d.width; c.stroke(path);
    // roderas
    c.strokeStyle = 'rgba(0,0,0,0.14)'; c.lineWidth = 4;
    for (const s of [-0.3, 0.3]) {
      c.beginPath();
      for (let i = 0; i <= this.n; i++) {
        const j = i % this.n, p = this.pts[j], nm = this.normals[j];
        const x = p.x + nm.x * this.halfW * s * 2, y = p.y + nm.y * this.halfW * s * 2;
        i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
      }
      c.stroke();
    }
    // postes del borde (rojo/blanco)
    for (let i = 0; i < this.n; i += 7) {
      const p = this.pts[i], nm = this.normals[i];
      c.fillStyle = (i / 7) % 2 < 1 ? '#d63a2a' : '#f2f2f2';
      for (const s of [1, -1]) {
        c.fillRect(p.x + nm.x * (this.halfW + 7) * s - 3, p.y + nm.y * (this.halfW + 7) * s - 3, 6, 6);
      }
    }
    // obstáculos estáticos
    for (const o of this.obstacles) {
      if (o.type === 'puddle') {
        c.fillStyle = '#1d4f7a'; c.beginPath(); c.ellipse(o.x, o.y, o.r, o.r * 0.62, 0.3, 0, TAU); c.fill();
        c.fillStyle = '#3e8ec4'; c.beginPath(); c.ellipse(o.x - 3, o.y - 2, o.r * 0.6, o.r * 0.35, 0.3, 0, TAU); c.fill();
      } else if (o.type === 'ice') {
        c.fillStyle = '#bfe8ff'; c.beginPath(); c.ellipse(o.x, o.y, o.r, o.r * 0.66, -0.2, 0, TAU); c.fill();
        c.fillStyle = 'rgba(255,255,255,0.8)'; c.fillRect(o.x - 8, o.y - 4, 10, 2); c.fillRect(o.x, o.y + 2, 8, 2);
      } else if (o.type === 'bump') {
        c.fillStyle = 'rgba(0,0,0,0.3)'; c.beginPath(); c.ellipse(o.x, o.y + 2, o.r, o.r * 0.6, 0, 0, TAU); c.fill();
        c.fillStyle = d.theme === 'snow' ? '#dcedf6' : '#9c7340';
        c.beginPath(); c.ellipse(o.x, o.y, o.r * 0.9, o.r * 0.55, 0, 0, TAU); c.fill();
        c.fillStyle = 'rgba(255,255,255,0.35)'; c.beginPath(); c.ellipse(o.x - 2, o.y - 3, o.r * 0.4, o.r * 0.2, 0, 0, TAU); c.fill();
      } else if (o.type === 'tires') {
        for (const [ox, oy] of [[-8, 4], [8, 4], [0, -6]]) {
          c.fillStyle = '#15151a'; c.beginPath(); c.arc(o.x + ox, o.y + oy, 9, 0, TAU); c.fill();
          c.fillStyle = d.bg; c.beginPath(); c.arc(o.x + ox, o.y + oy, 4, 0, TAU); c.fill();
        }
      }
    }
    // línea de meta en pts[0]
    const p0 = this.pts[0], n0 = this.normals[0];
    for (let row = 0; row < 2; row++) {
      for (let k = -6; k < 6; k++) {
        c.fillStyle = (k + row) % 2 === 0 ? '#fff' : '#111';
        const off = (k + 0.5) * (this.halfW / 6);
        const x = p0.x + n0.x * off - n0.tx * row * 8, y = p0.y + n0.y * off - n0.ty * row * 8;
        c.save(); c.translate(x, y); c.rotate(Math.atan2(n0.y, n0.x)); c.fillRect(-this.halfW / 12, -4, this.halfW / 6, 8); c.restore();
      }
    }
    return cv;
  }
  // punto más cercano de la línea central, búsqueda local alrededor de hint
  nearest(x, y, hint) {
    const pts = this.pts, n = this.n;
    let best = Infinity, bi = hint;
    for (let k = -8; k <= 12; k++) {
      const i = (hint + k + n) % n;
      const dx = x - pts[i].x, dy = y - pts[i].y, d = dx * dx + dy * dy;
      if (d < best) { best = d; bi = i; }
    }
    // proyección sobre los dos segmentos adyacentes
    let cx = pts[bi].x, cy = pts[bi].y, bd = best, frac = 0;
    for (const s of [-1, 1]) {
      const j = (bi + s + n) % n;
      const ax = pts[bi].x, ay = pts[bi].y, bx2 = pts[j].x, by2 = pts[j].y;
      const ex = bx2 - ax, ey = by2 - ay, ll = ex * ex + ey * ey;
      if (ll < 1e-6) continue;
      let t = ((x - ax) * ex + (y - ay) * ey) / ll;
      t = clamp(t, 0, 1);
      const qx = ax + ex * t, qy = ay + ey * t;
      const dx = x - qx, dy = y - qy, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; cx = qx; cy = qy; if (s === 1) frac = t; }
    }
    return { idx: bi, cx, cy, dist: Math.sqrt(bd), frac };
  }
}

/* ---------------- Coche ---------------- */
const CAR_R = 13;
class Car {
  constructor(def, isPlayer, ups, sheet, name) {
    this.def = def; this.isPlayer = isPlayer; this.sheet = sheet; this.name = name;
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.angle = 0;
    this.maxSpeed = 250 * (0.88 + def.vel * 0.04) * (1 + (ups ? ups.vel : 0) * 0.06);
    this.accel = 300 * (0.80 + def.acc * 0.06) * (1 + (ups ? ups.acc : 0) * 0.08);
    this.turnRate = 2.7 * (0.85 + def.ctl * 0.05);
    this.gripBase = 4.2 * (0.80 + def.ctl * 0.07);
    this.nitroMax = 100 * (1 + (ups ? ups.nit : 0) * 0.15);
    this.nitroPow = 1.35 + (ups ? ups.nit : 0) * 0.07;
    this.nitro = this.nitroMax;
    this.nitroOn = false;
    this.air = 0;            // tiempo en el aire (bache)
    this.surfGrip = 1;       // multiplicador por superficie/charco/hielo
    this.surfDrag = 0;
    this.inObst = {};        // ids de obstáculos pisados (para sonar solo al entrar)
    this.cur = 0; this.totalWp = 0; this.spawnIdx = 0;
    this.frac = 0; this.lapFlash = 0;
    this.lapStart = 0; this.lastLap = null; this.bestLap = null;
    this.bestFlash = 0; this.wrongT = 0;
    this.finished = false; this.finishT = null; this.finishOrder = 0;
    this.aiSkill = 1; this.aiSeed = Math.random() * 1000; this.steerIn = 0;
  }
  get speed() { return hyp(this.vx, this.vy); }
  progress() { return this.totalWp + this.frac; }
  control(track, race, dt) {
    if (this.isPlayer) {
      this.in = { steer: Input.steer, gas: Input.gas, brake: Input.brake, nitro: Input.nitro };
    } else {
      this.aiControl(track, race, dt);
    }
  }
  aiControl(track, race, dt) {
    const look = 6 + Math.floor(this.speed / 38);
    const tgt = track.pts[(this.cur + look) % track.n];
    const want = Math.atan2(tgt.y - this.y, tgt.x - this.x);
    let diff = angDiff(want, this.angle);
    // esquivar coche delante
    for (const o of race.cars) {
      if (o === this) continue;
      const dx = o.x - this.x, dy = o.y - this.y, d = hyp(dx, dy);
      if (d < 55 && d > 1) {
        const aTo = Math.atan2(dy, dx);
        const rel = angDiff(aTo, this.angle);
        if (Math.abs(rel) < 0.7) diff += rel > 0 ? -0.55 : 0.55;
      }
    }
    const wob = Math.sin(race.t * 1.7 + this.aiSeed) * 0.06; // imperfección arcade
    const steer = clamp(diff * 2.6 + wob, -1, 1);
    const hard = Math.abs(diff) > 1.05 && this.speed > this.maxSpeed * 0.5;
    // banda elástica respecto al jugador
    let band = 0;
    if (race.player && race.player !== this) {
      band = clamp((race.player.progress() - this.progress()) * 0.0018, -0.05, 0.09);
    }
    this.aiSpeedMul = this.aiSkill + band;
    const wantNitro = Math.abs(diff) < 0.14 && this.nitro > this.nitroMax * 0.55 &&
      this.speed > this.maxSpeed * 0.6 && Math.sin(race.t * 0.6 + this.aiSeed * 3) > 0.55;
    this.in = { steer, gas: !hard, brake: hard, nitro: wantNitro };
  }
  physics(track, race, dt) {
    const inp = this.in || { steer: 0, gas: false, brake: false, nitro: false };
    const locked = race.raceT < 0 || this.finished;
    const steer = locked ? 0 : inp.steer;
    const gas = locked ? false : inp.gas;
    const brake = locked ? false : inp.brake;

    // nitro
    this.nitroOn = !locked && inp.nitro && this.nitro > 0 && gas;
    if (this.nitroOn) this.nitro = Math.max(0, this.nitro - 38 * dt);
    else this.nitro = Math.min(this.nitroMax, this.nitro + 1.8 * dt); // recarga lenta: recoge botellas N


    const cos = Math.cos(this.angle), sin = Math.sin(this.angle);
    let fwd = this.vx * cos + this.vy * sin;
    let lat = -this.vx * sin + this.vy * cos;

    const skill = this.isPlayer ? 1 : (this.aiSpeedMul || this.aiSkill);
    const maxCur = this.maxSpeed * skill * (this.nitroOn ? this.nitroPow : 1) * (this.air > 0 ? 1 : 1);
    const accCur = this.accel * skill * (this.nitroOn ? 1.55 : 1);

    // giro: el morro sigue siempre al volante (sin inversión en marcha atrás)
    const spd = this.speed;
    const airMul = this.air > 0 ? 0.35 : 1;
    this.angle += steer * this.turnRate * dt * clamp(spd / 65, 0, 1) * airMul;

    // empuje
    if (gas) fwd += accCur * (1 - clamp(fwd / maxCur, -1, 1)) * dt;
    if (brake) {
      if (fwd > 12) fwd -= 480 * dt;
      else fwd = Math.max(fwd - accCur * 0.5 * dt, -this.maxSpeed * 0.35);
    }
    // resistencias
    const drag = 0.55 + this.surfDrag;
    fwd -= fwd * drag * dt;
    // agarre lateral (derrape)
    const grip = this.gripBase * track.def.gripMul * this.surfGrip * (this.air > 0 ? 0.15 : 1);
    lat -= lat * clamp(grip * dt, 0, 1);

    const ncos = Math.cos(this.angle), nsin = Math.sin(this.angle);
    this.vx = ncos * fwd - nsin * lat;
    this.vy = nsin * fwd + ncos * lat;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.air > 0) this.air -= dt;

    // superficies / obstáculos
    this.surfGrip = 1; this.surfDrag = 0;
    for (let i = 0; i < track.obstacles.length; i++) {
      const o = track.obstacles[i];
      const dx = this.x - o.x, dy = this.y - o.y;
      const inside = dx * dx + dy * dy < (o.r + 4) * (o.r + 4);
      if (o.type === 'tires') {
        if (dx * dx + dy * dy < (o.r + CAR_R) * (o.r + CAR_R)) {
          const d = hyp(dx, dy) || 1, nx = dx / d, ny = dy / d;
          this.x = o.x + nx * (o.r + CAR_R); this.y = o.y + ny * (o.r + CAR_R);
          const vn = this.vx * nx + this.vy * ny;
          if (vn < 0) {
            this.vx -= vn * nx * 1.6; this.vy -= vn * ny * 1.6;
            if (this.isPlayer && Math.abs(vn) > 90) { AudioFX.crash(); race.sparks(this.x, this.y); }
          }
        }
        continue;
      }
      if (inside) {
        if (o.type === 'puddle') {
          this.surfGrip = 0.5; this.surfDrag = 1.6;
          if (!this.inObst[i]) {
            if (this.speed > 80) { race.splash(this.x, this.y); if (this.isPlayer) AudioFX.splash(); }
          }
        } else if (o.type === 'ice') {
          this.surfGrip = 0.18;
        } else if (o.type === 'bump') {
          if (!this.inObst[i] && this.speed > 90 && this.air <= 0) {
            this.air = 0.38;
            this.vx *= 0.92; this.vy *= 0.92;
            if (this.isPlayer) AudioFX.burst(0.12, 0.12, 600);
          }
        }
        this.inObst[i] = true;
      } else {
        this.inObst[i] = false;
      }
    }

    // muros de la pista
    const near = track.nearest(this.x, this.y, this.cur);
    if (near.dist > track.halfW - CAR_R + 4) {
      const nx = (this.x - near.cx) / (near.dist || 1), ny = (this.y - near.cy) / (near.dist || 1);
      this.x = near.cx + nx * (track.halfW - CAR_R + 4);
      this.y = near.cy + ny * (track.halfW - CAR_R + 4);
      const vn = this.vx * nx + this.vy * ny;
      if (vn > 0) {
        // rebote suave: pierde menos velocidad y conserva la componente tangencial
        this.vx -= vn * nx * 1.28; this.vy -= vn * ny * 1.28;
        if (Math.abs(vn) > 130) {
          race.sparks(this.x, this.y);
          if (this.isPlayer) { AudioFX.crash(); race.shake = 5; vib(45); }
        }
      }
    }
    // progreso / vueltas
    const delta = (near.idx - this.cur + track.n) % track.n;
    if (delta > 0 && delta <= 13) {
      this.totalWp += delta;
      this.cur = near.idx;
      const lapsDone = Math.floor((this.totalWp + this.spawnIdx) / track.n);
      if (lapsDone > this.lapsDone) {
        this.lapsDone = lapsDone;
        this.lapFlash = 1.2;
        const lt = race.raceT - this.lapStart;
        this.lapStart = race.raceT;
        if (lt > 5) {
          this.lastLap = lt;
          if (this.bestLap == null || lt < this.bestLap) {
            this.bestLap = lt;
            if (this.lapsDone > 1) this.bestFlash = 2; // la 1ª vuelta siempre es "mejor"
          }
        }
        if (!this.finished) {
          this.nitro = Math.min(this.nitroMax, this.nitro + 20);
          if (this.isPlayer && lapsDone < race.laps) AudioFX.beep(880, 0.15, 0.15);
        }
        if (lapsDone >= race.laps && !this.finished) race.carFinished(this);
      }
    }
    this.frac = near.frac;
  }
}

const NITRO_SPR = (() => {
  const cv = document.createElement('canvas'); cv.width = 28; cv.height = 28;
  const c = cv.getContext('2d');
  c.fillStyle = '#d63a2a'; c.fillRect(10, 2, 8, 5);        // tapón
  c.fillStyle = '#1f5fd6'; c.fillRect(7, 6, 14, 19);       // botella
  c.fillStyle = '#3a8ef0'; c.fillRect(9, 8, 4, 15);        // brillo

/* ---------------- Partículas ---------------- */
class Particles {
  constructor() { this.list = []; }
  add(x, y, vx, vy, life, size, color) {
    if (this.list.length > 240) this.list.shift();
    this.list.push({ x, y, vx, vy, t: 0, life, size, color });
  }
  update(dt) {
    const l = this.list;
    for (let i = l.length - 1; i >= 0; i--) {
      const p = l[i];
      p.t += dt;
      if (p.t >= p.life) { l.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.96; p.vy *= 0.96;
    }
  }
  draw(c) {
    for (const p of this.list) {
      const a = 1 - p.t / p.life;
      c.globalAlpha = a * 0.85;
      c.fillStyle = p.color;
      const s = p.size * (0.6 + a * 0.6);
      c.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    c.globalAlpha = 1;
  }
}

/* ---------------- Carrera ---------------- */
class Race {
  /* opts: { trackIdx, playerCar (índice o -1 = demo), ups, difficulty, laps } */
  constructor(opts) {
    this.opts = opts;
    this.trackDef = TRACKS[opts.trackIdx % TRACKS.length];
    this.track = new Track(this.trackDef);
    this.laps = opts.laps;
    this.attract = opts.playerCar < 0;
    this.t = 0;
    this.raceT = this.attract ? 1 : -3.8;
    this.over = false; this.overT = 0;
    this.shake = 0;
    this.finishCount = 0;
    this.particles = new Particles();
    this.cars = [];
    this.results = null;
    // capa de marcas de derrape (persistente durante la carrera)
    this.marks = document.createElement('canvas');
    this.marks.width = 1280; this.marks.height = 720;
    this.mctx = this.marks.getContext('2d');
    // botellas de nitro y bolsas de dinero repartidas por la pista
    this.pickups = [];
    this.bonusCash = 0;
    this.playerWon = false;
    this.prevPos = 4; this.posFlashT = 0; this.posFlashDir = 0;
    const kinds = ['nitro', 'nitro', 'nitro', 'cash', 'cash'];
    for (let i = 0; i < kinds.length; i++) {
      const p = { slot: i, type: kinds[i], active: true, respawnT: 0, seed: Math.random() * 10, x: 0, y: 0 };
      this.placePickup(p);
      this.pickups.push(p);
    }

    // jugador + rivales
    const usedColors = [];
    let player = null;
    if (!this.attract) {
      const cd = CARS[opts.playerCar];
      player = new Car(cd, true, opts.ups, makeTruckSheet(cd.c1, cd.c2), 'IVÁN');
      usedColors.push(cd.c1);
      this.cars.push(player);
    }
    this.player = player;
    const diff = opts.difficulty || 0;
    const skills = [0.86 + diff * 0.022, 0.91 + diff * 0.022, 0.95 + diff * 0.022];
    const nAI = this.attract ? 4 : 3;
    for (let i = 0; i < nAI; i++) {
      const col = AI_COLORS.find(c => !usedColors.includes(c[0])) || AI_COLORS[i];
      usedColors.push(col[0]);
      const base = CARS[(i + 1) % CARS.length];
      const aiUps = { vel: Math.round((opts.ups ? opts.ups.vel : 0) * 0.6), acc: Math.round((opts.ups ? opts.ups.acc : 0) * 0.6), nit: 1 };
      const car = new Car(base, false, aiUps, makeTruckSheet(col[0], col[1]), AI_NAMES[i] || 'CPU');
      car.aiSkill = this.attract ? 0.95 : Math.min(1.12, skills[i % skills.length]);
      this.cars.push(car);
    }
    // parrilla de salida (tras la línea de meta)
    const tk = this.track;
    const grid = [[8, 0.45], [8, -0.45], [3, 0.45], [3, -0.45]];
    const order = this.attract ? this.cars : [this.cars[1], this.cars[2], this.cars[3], this.cars[0]]; // jugador última fila
    for (let i = 0; i < order.length; i++) {
      const [idx, side] = grid[i];
      const p = tk.pts[idx], nm = tk.normals[idx];
      const car = order[i];
      car.x = p.x + nm.x * tk.halfW * side;
      car.y = p.y + nm.y * tk.halfW * side;
      car.angle = Math.atan2(nm.ty, nm.tx);
      car.cur = idx; car.spawnIdx = idx; car.lapsDone = 0;
    }
    this.beeped = {};
  }
  placePickup(p) {
    // cada recogible vive en un tercio del circuito, en un punto aleatorio
    const tk = this.track, n = tk.n;
    let idx = ((n * ((p.slot % 3) + 0.25 + Math.random() * 0.5) / 3) | 0) % n;
    if (idx < 12) idx += 14;                       // lejos de la línea de meta
    const pt = tk.pts[idx], nm = tk.normals[idx];
    const off = (Math.random() * 2 - 1) * tk.halfW * 0.45;
    p.x = pt.x + nm.x * off;
    p.y = pt.y + nm.y * off;
    p.active = true;
  }
  sparks(x, y) {
    for (let i = 0; i < 6; i++) {
      this.particles.add(x, y, (Math.random() - 0.5) * 180, (Math.random() - 0.5) * 180, 0.35, 4, i % 2 ? '#ffd23c' : '#fff');
    }
  }
  splash(x, y) {
    for (let i = 0; i < 8; i++) {
      this.particles.add(x, y, (Math.random() - 0.5) * 140, (Math.random() - 0.5) * 140 - 40, 0.5, 5, '#7ec8f2');
    }
  }
  carFinished(car) {
    car.finished = true;
    car.finishT = this.raceT;
    car.finishOrder = ++this.finishCount;
    if (car.isPlayer) {
      this.over = true; this.overT = 0;
      this.playerWon = car.finishOrder === 1;
      AudioFX.jingle();
      vib([80, 60, 80]);
    }
  }
  rank() {
    const arr = this.cars.slice();
    arr.sort((a, b) => {
      if (a.finished && b.finished) return a.finishOrder - b.finishOrder;
      if (a.finished) return -1;
      if (b.finished) return 1;
      return b.progress() - a.progress();
    });
    return arr;
  }
  update(dt) {
    this.t += dt;
    this.raceT += dt;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 18);

    // pitidos de cuenta atrás
    if (!this.attract) {
      for (const n of [3, 2, 1, 0]) {
        if (this.raceT >= -n && !this.beeped[n]) {
          this.beeped[n] = true;
          AudioFX.beep(n === 0 ? 1040 : 440, n === 0 ? 0.45 : 0.18, 0.2);
        }
      }
    }
    for (const car of this.cars) car.control(this.track, this, dt);
    for (const car of this.cars) car.physics(this.track, this, dt);

    // recogida y reaparición de botellas de nitro
    for (const p of this.pickups) {
      if (!p.active) {
        p.respawnT -= dt;
        if (p.respawnT <= 0) this.placePickup(p);
        continue;
      }
      for (const car of this.cars) {
        const dx = car.x - p.x, dy = car.y - p.y;
        if (dx * dx + dy * dy < 24 * 24) {
          p.active = false;
          p.respawnT = p.type === 'cash' ? 9 : 7;
          if (p.type === 'nitro') {
            car.nitro = Math.min(car.nitroMax, car.nitro + 35);
            if (car.isPlayer) { AudioFX.pickup(); vib(25); }
          } else if (car.isPlayer) {
            this.bonusCash += [50, 75, 100][(Math.random() * 3) | 0];
            AudioFX.coin(); vib(25);
          }
          const cols = p.type === 'nitro' ? ['#7ec8ff', '#ffe43c'] : ['#ffd23c', '#e8a83c'];
          for (let i = 0; i < 10; i++) {
            this.particles.add(p.x, p.y, (Math.random() - 0.5) * 160, (Math.random() - 0.5) * 160,
              0.45, 5, cols[i % 2]);
          }
          break;
        }
      }
    }

    // colisiones coche-coche
    const cs = this.cars;
    for (let i = 0; i < cs.length; i++) {
      for (let j = i + 1; j < cs.length; j++) {
        const a = cs[i], b = cs[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy, min = CAR_R * 2;
        if (d2 < min * min && d2 > 0.01) {
          const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ov = (min - d) / 2;
          a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
          const rvx = a.vx - b.vx, rvy = a.vy - b.vy;
          const vn = rvx * nx + rvy * ny;
          if (vn > 0) {
            const imp = vn * 0.85;
            a.vx -= imp * nx * 0.5; a.vy -= imp * ny * 0.5;
            b.vx += imp * nx * 0.5; b.vy += imp * ny * 0.5;
            if (vn > 110) {
              this.sparks((a.x + b.x) / 2, (a.y + b.y) / 2);
              if (a.isPlayer || b.isPlayer) { AudioFX.burst(0.22, 0.18, 1100); this.shake = 4; vib(30); }
            }
          }
        }
      }
    }
    // polvo / estela / marcas de derrape
    const mc = this.mctx;
    mc.fillStyle = this.trackDef.theme === 'snow' ? 'rgba(95,120,145,0.10)' : 'rgba(25,16,8,0.12)';
    for (const car of this.cars) {
      const cos = Math.cos(car.angle), sin = Math.sin(car.angle);
      const lat = -car.vx * sin + car.vy * cos;
      const skid = car.air <= 0 && (Math.abs(lat) > 55 || (car.in && car.in.brake && car.speed > 110));
      if (skid) {
        const wx = -sin * 8, wy = cos * 8;
        mc.fillRect(car.x - cos * 12 + wx - 2, car.y - sin * 12 + wy - 2, 4, 4);
        mc.fillRect(car.x - cos * 12 - wx - 2, car.y - sin * 12 - wy - 2, 4, 4);
      }
      if ((Math.abs(lat) > 55 || (car.speed > 60 && Math.random() < 0.25)) && car.air <= 0) {
        const col = this.trackDef.theme === 'snow' ? '#e8f4fb' : 'rgba(120,90,50,0.9)';
        this.particles.add(car.x - cos * 16, car.y - sin * 16,
          (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30, 0.55, 6, col);
      }
      if (car.nitroOn) {
        for (let i = 0; i < 2; i++) {
          this.particles.add(car.x - cos * 20, car.y - sin * 20,
            -cos * 90 + (Math.random() - 0.5) * 50, -sin * 90 + (Math.random() - 0.5) * 50,
            0.3, 7, Math.random() < 0.5 ? '#ff8c1e' : '#ffe43c');
        }
      }
    }
    this.particles.update(dt);
    // sonido del motor y derrape del jugador + detector de sentido contrario
    if (this.player && !this.attract) {
      const p = this.player;
      AudioFX.engine(clamp(p.speed / p.maxSpeed, 0, 1.2), p.nitroOn);
      const pc = Math.cos(p.angle), ps = Math.sin(p.angle);
      const plat = -p.vx * ps + p.vy * pc;
      AudioFX.skid(p.air <= 0 && this.raceT > 0 ? clamp((Math.abs(plat) - 50) / 130, 0, 1) : 0);
      const nm = this.track.normals[p.cur];
      const dot = p.speed > 60 ? (p.vx * nm.tx + p.vy * nm.ty) / p.speed : 1;
      p.wrongT = dot < -0.4 ? (p.wrongT || 0) + dt : 0;
    }
    if (this.over) {
      this.overT += dt;
      // confeti si el jugador ha ganado
      if (this.playerWon && this.overT < 1.8) {
        const CONF = ['#ffd23c', '#e8302a', '#48e06a', '#3a8ef0', '#fff'];
        for (let i = 0; i < 3; i++) {
          this.particles.add(Math.random() * 1280, -5, (Math.random() - 0.5) * 60,
            140 + Math.random() * 160, 1.6, 6, CONF[(Math.random() * 5) | 0]);
        }
      }
    }
    // demo: reiniciar cuando terminen vueltas
    if (this.attract && this.cars.every(c => c.lapsDone >= 50)) this.t = 0;
  }
  draw(c) {
    c.save();
    if (this.shake > 0.3) c.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
    c.drawImage(this.track.canvas, 0, 0);
    c.drawImage(this.marks, 0, 0);
    // recogibles (flotan y pulsan)
    for (const p of this.pickups) {
      if (!p.active) continue;
      const bob = Math.sin(this.t * 3 + p.seed) * 3;
      const pul = 0.22 + 0.13 * Math.sin(this.t * 5 + p.seed);
      c.globalAlpha = pul;
      c.fillStyle = p.type === 'nitro' ? '#7ec8ff' : '#ffd23c';
      c.beginPath(); c.arc(p.x, p.y + bob, 21, 0, TAU); c.fill();
      c.globalAlpha = 1;
      c.drawImage(p.type === 'nitro' ? NITRO_SPR : CASH_SPR, p.x - 14, p.y - 14 + bob);
    }
    this.particles.draw(c);
    // coches (sombras y sprites)
    for (const car of this.cars) {
      c.globalAlpha = 0.35;
      c.fillStyle = '#000';
      const air = car.air > 0 ? 6 : 0;
      c.beginPath(); c.ellipse(car.x + 3 + air, car.y + 5 + air, 17, 10, car.angle, 0, TAU); c.fill();
      c.globalAlpha = 1;
    }
    for (const car of this.cars) {
      let a = car.angle % TAU; if (a < 0) a += TAU;
      const fr = Math.round(a / TAU * SPR_FRAMES) % SPR_FRAMES;
      const sc = car.air > 0 ? 1.18 : 1;
      const sz = SPR_SIZE * sc;
      c.drawImage(car.sheet, fr * SPR_SIZE, 0, SPR_SIZE, SPR_SIZE, car.x - sz / 2, car.y - sz / 2, sz, sz);
      if (car.isPlayer) { // marcador P1
        c.fillStyle = '#ffd23c';
        c.beginPath();
        c.moveTo(car.x, car.y - 26); c.lineTo(car.x - 6, car.y - 36); c.lineTo(car.x + 6, car.y - 36);
        c.fill();
      }
    }
    // líneas de velocidad con el nitro
    if (this.player && this.player.nitroOn && !this.attract) {
      c.strokeStyle = 'rgba(255,255,255,0.16)';
      c.lineWidth = 2;
      c.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = Math.random() * TAU;
        const r1 = 330 + Math.random() * 180, r2 = r1 + 70 + Math.random() * 90;
        c.moveTo(640 + Math.cos(a) * r1, 360 + Math.sin(a) * r1 * 0.62);
        c.lineTo(640 + Math.cos(a) * r2, 360 + Math.sin(a) * r2 * 0.62);
      }
      c.stroke();
    }
    if (!this.attract) this.drawHUD(c);
    c.restore();
  }
  drawHUD(c) {
    const p = this.player;
    c.fillStyle = 'rgba(0,0,0,0.55)';
    c.fillRect(0, 0, 1280, 44);
    c.textBaseline = 'middle';
    c.font = 'bold 22px "Courier New", monospace';
    // posición (con flecha al adelantar / ser adelantado)
    const rk = this.rank();
    const pos = rk.indexOf(p) + 1;
    if (pos !== this.prevPos) {
      this.posFlashT = 1; this.posFlashDir = pos < this.prevPos ? 1 : -1;
      this.prevPos = pos;
    }
    c.fillStyle = pos === 1 ? '#ffd23c' : '#fff';
    c.fillText('POS ' + pos + 'º/4', 18, 23);
    if (this.posFlashT > 0) {
      this.posFlashT -= 1 / 60;
      if ((this.t * 8 | 0) % 2) {
        c.fillStyle = this.posFlashDir > 0 ? '#48e06a' : '#e8302a';
        c.fillText(this.posFlashDir > 0 ? '▲' : '▼', 138, 23);
      }
    }
    // vuelta
    c.fillStyle = p.lapFlash > 0 && (this.t * 8 | 0) % 2 ? '#48e06a' : '#fff';
    if (p.lapFlash > 0) p.lapFlash -= 1 / 60;
    c.fillText('VUELTA ' + Math.min(this.laps, p.lapsDone + 1) + '/' + this.laps, 190, 23);
    // tiempo
    c.fillStyle = '#7ee8ff';
    c.fillText('⏱ ' + fmtTime(Math.max(0, p.finished ? p.finishT : this.raceT)), 420, 23);
    // circuito
    c.fillStyle = '#9aa3b8';
    c.font = 'bold 15px "Courier New", monospace';
    c.fillText(this.trackDef.name + ' · CARRERA ' + ((this.opts.difficulty || 0) + 1), 640, 23);
    // nitro
    c.font = 'bold 16px "Courier New", monospace';
    c.fillStyle = '#fff';
    c.fillText('NITRO', 960, 23);
    c.fillStyle = '#222';
    c.fillRect(1035, 12, 200, 20);
    const nr = p.nitro / p.nitroMax;
    c.fillStyle = p.nitroOn ? '#ffe43c' : (nr > 0.35 ? '#3a8ef0' : '#e8542f');
    c.fillRect(1037, 14, 196 * nr, 16);
    c.strokeStyle = '#888'; c.strokeRect(1035.5, 12.5, 200, 20);
    // clasificación en vivo
    c.font = 'bold 14px "Courier New", monospace';
    for (let i = 0; i < rk.length; i++) {
      const car = rk[i], y = 60 + i * 22;
      c.fillStyle = car.isPlayer ? 'rgba(255,210,60,0.25)' : 'rgba(0,0,0,0.4)';
      c.fillRect(8, y, 104, 19);
      c.fillStyle = car.isPlayer ? '#ffd23c' : '#ddd';
      c.fillText((i + 1) + '· ' + car.name + (car.finished ? ' 🏁' : ''), 14, y + 10);
    }
    // bonus de dinero recogido en pista
    if (this.bonusCash > 0) {
      c.fillStyle = 'rgba(0,0,0,0.4)'; c.fillRect(8, 60 + 4 * 22, 104, 19);
      c.fillStyle = '#48e06a'; c.fillText('💰 +$' + this.bonusCash, 14, 60 + 4 * 22 + 10);
    }
    // tiempos de vuelta (anterior / récord)
    c.font = 'bold 13px "Courier New", monospace';
    c.fillStyle = '#9aa3b8';
    const recKey = 'l' + (this.opts.trackIdx % TRACKS.length);
    const rec = (p.bestLap != null && (G.save.best[recKey] == null || p.bestLap < G.save.best[recKey]))
      ? p.bestLap : G.save.best[recKey];
    c.fillText('VTA ANT ' + fmtTime(p.lastLap) + '  ·  RÉCORD VTA ' + fmtTime(rec), 1035, 48);
    // ¡mejor vuelta!
    if (p.bestFlash > 0) {
      p.bestFlash -= 1 / 60;
      if ((this.t * 6 | 0) % 2) {
        c.textAlign = 'center';
        c.font = 'bold 30px "Courier New", monospace';
        c.fillStyle = '#48e06a'; c.strokeStyle = '#000'; c.lineWidth = 4;
        c.strokeText('¡MEJOR VUELTA! ' + fmtTime(p.bestLap), 640, 130);
        c.fillText('¡MEJOR VUELTA! ' + fmtTime(p.bestLap), 640, 130);
        c.textAlign = 'left';
      }
    }
    // sentido contrario
    if (p.wrongT > 0.7 && !p.finished) {
      if ((this.t * 6 | 0) % 2) {
        c.textAlign = 'center';
        c.font = 'bold 44px "Courier New", monospace';
        c.fillStyle = '#e8302a'; c.strokeStyle = '#000'; c.lineWidth = 5;
        c.strokeText('⇆ ¡SENTIDO CONTRARIO!', 640, 250);
        c.fillText('⇆ ¡SENTIDO CONTRARIO!', 640, 250);
        c.textAlign = 'left';
      }
    }
    // salida: cartel del circuito + semáforo
    if (this.raceT < 1) {
      c.textAlign = 'center';
      if (this.raceT < 0) {
        c.fillStyle = 'rgba(0,0,0,0.55)';
        c.fillRect(390, 130, 500, 90);
        c.strokeStyle = '#ffd23c'; c.lineWidth = 3; c.strokeRect(390, 130, 500, 90);
        c.font = 'bold 34px "Courier New", monospace';
        c.fillStyle = '#ffd23c';
        c.fillText(this.trackDef.name, 640, 160);
        c.font = 'bold 16px "Courier New", monospace';
        c.fillStyle = '#9fd8ff';
        const recKey2 = 'l' + (this.opts.trackIdx % TRACKS.length);
        c.fillText('CARRERA ' + ((this.opts.difficulty || 0) + 1) + ' · ' + this.laps +
          ' VUELTAS · RÉCORD ' + fmtTime(G.save.best[recKey2]), 640, 196);
      }
      // semáforo
      const lit = this.raceT < 0 ? clamp(Math.floor(this.raceT + 4), 0, 3) : 3;
      const green = this.raceT >= 0;
      c.fillStyle = '#15151a';
      c.fillRect(577, 244, 126, 50);
      c.strokeStyle = '#444'; c.lineWidth = 3; c.strokeRect(577, 244, 126, 50);
      for (let i = 0; i < 3; i++) {
        const on = green || i < lit;
        c.fillStyle = green ? '#3aff5e' : (on ? '#ff2a1e' : '#331111');
        c.beginPath(); c.arc(607 + i * 33, 269, 12, 0, TAU); c.fill();
        if (on) {
          c.globalAlpha = 0.3;
          c.beginPath(); c.arc(607 + i * 33, 269, 17, 0, TAU); c.fill();
          c.globalAlpha = 1;
        }
      }
      if (green) {
        c.font = 'bold 90px "Courier New", monospace';
        c.fillStyle = '#48e06a'; c.strokeStyle = '#000'; c.lineWidth = 6;
        c.strokeText('¡GO!', 640, 380); c.fillText('¡GO!', 640, 380);
      }
      c.textAlign = 'left';
    }
    if (this.over && this.overT < 2) {
      c.textAlign = 'center';
      c.font = 'bold 80px "Courier New", monospace';
      c.fillStyle = '#ffd23c'; c.strokeStyle = '#000'; c.lineWidth = 5;
      c.strokeText('¡META!', 640, 330); c.fillText('¡META!', 640, 330);
      c.textAlign = 'left';
    }
  }
}

  save: Store.load() || defaultSave(),
  hasSave: !!Store.load(),
  selCar: 0,
  lastResults: null
};

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  if (id) document.getElementById(id).classList.add('on');
}
function isTouch() { return matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window; }

function startAttract() {
  G.race = new Race({ trackIdx: (Math.random() * 3) | 0, playerCar: -1, ups: null, difficulty: 2, laps: 99 });
}
function startRace() {
  AudioFX.unlock();
  G.state = 'race';
  G.paused = false;
  show(null);
  document.getElementById('touchUI').classList.toggle('on', isTouch());
  document.getElementById('pauseBtn').classList.add('on');
  document.getElementById('homeBtn').classList.add('on');
  G.race = new Race({
    trackIdx: G.save.race % TRACKS.length,
    playerCar: G.save.car,
    ups: G.save.up,
    difficulty: G.save.race,
    laps: 4
  });
  AudioFX.startEngine();
  // pantalla completa en móvil
  if (isTouch() && !document.fullscreenElement && document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
}
function endRace() {
  const race = G.race;
  const rk = race.rank();
  AudioFX.stopEngine();
  document.getElementById('touchUI').classList.remove('on');
  document.getElementById('pauseBtn').classList.remove('on');
  document.getElementById('homeBtn').classList.remove('on');
  const PRIZES = [350, 250, 180, 120];
  const pos = rk.indexOf(race.player) + 1;
  const earned = PRIZES[pos - 1] + race.opts.difficulty * 25 + race.bonusCash;
  G.save.money += earned;
  G.save.race++;
  // mejores tiempos (carrera y vuelta)
  const tIdx = race.opts.trackIdx % TRACKS.length;
  const key = 't' + tIdx, lkey = 'l' + tIdx;
  const pt = race.player.finishT, bl = race.player.bestLap;
  if (pt != null && (!G.save.best[key] || pt < G.save.best[key])) G.save.best[key] = pt;
  if (bl != null && (!G.save.best[lkey] || bl < G.save.best[lkey])) G.save.best[lkey] = bl;
  Store.save(G.save);
  // tabla de resultados
  const tbl = document.getElementById('resTable');
  tbl.innerHTML = '';
  rk.forEach((car, i) => {
    const tr = document.createElement('tr');
    if (car.isPlayer) tr.className = 'me';
    const t = car.finished ? fmtTime(car.finishT) : '—';
    const prize = car.isPlayer ? `<span class="money">+$${earned}</span>` : '';
    tr.innerHTML = `<td>${i + 1}º</td><td>${car.name}</td><td>${t}</td><td>${prize}</td>`;
    tbl.appendChild(tr);
  });
  if (race.bonusCash > 0 || bl != null) {
    const tre = document.createElement('tr');
    tre.innerHTML = `<td colspan="4" style="color:#9aa3b8">MEJOR VUELTA ${fmtTime(bl)}` +
      (race.bonusCash > 0 ? ` · BONUS PISTA <span class="money">$${race.bonusCash}</span>` : '') + `</td>`;
    tbl.appendChild(tre);
  }
  document.getElementById('resTitle').textContent =
    pos === 1 ? '🏆 ¡VICTORIA!' : (pos === 2 ? '🥈 ¡CASI!' : 'RESULTADOS');
  document.getElementById('resMoney').textContent = '$' + G.save.money;
  const best = G.save.best[key];
  if (best != null) {
    const trb = document.createElement('tr');
    trb.innerHTML = `<td colspan="4" style="color:#7ee8ff">RÉCORD ${race.trackDef.name}: ${fmtTime(best)}</td>`;
    tbl.appendChild(trb);
  }
  G.state = 'results';
  show('scrResults');
  startAttract();
}

/* ----- Selección de coche ----- */
function buildCarCards() {
  const row = document.getElementById('carRow');
  row.innerHTML = '';
  CARS.forEach((cd, i) => {
    const card = document.createElement('div');
    card.className = 'carCard' + (i === G.selCar ? ' sel' : '');
    const stat = (label, v) => {
      let pips = '';
      for (let j = 1; j <= 5; j++) pips += `<div class="pip${j <= v ? ' f' : ''}"></div>`;
      return `<div class="statRow"><b>${label}</b><div class="pips">${pips}</div></div>`;
    };
    card.innerHTML = `<h3>${cd.name}</h3>
      <canvas width="46" height="46"></canvas>
      ${stat('VEL', cd.vel)}${stat('ACC', cd.acc)}${stat('CTL', cd.ctl)}
      <div class="statRow" style="color:#9aa3b8">${cd.desc}</div>`;
    const mini = card.querySelector('canvas');
    const mc = mini.getContext('2d');
    mc.imageSmoothingEnabled = false;
    const sheet = makeTruckSheet(cd.c1, cd.c2);
    mc.drawImage(sheet, 48 * SPR_SIZE, 0, SPR_SIZE, SPR_SIZE, 0, 0, 46, 46);
    card.addEventListener('click', () => {
      G.selCar = i;
      G.save.car = i;
      buildCarCards();
    });
    row.appendChild(card);
  });
}

/* ----- Taller de mejoras ----- */
const UP_DEFS = [
  { key: 'vel', name: 'VELOCIDAD', icon: '🏎' },
  { key: 'acc', name: 'ACELERAC.', icon: '⚡' },
  { key: 'nit', name: 'NITRO', icon: '🔥' }
];
const UP_COSTS = [150, 300, 500, 750, 1000];
function buildShop() {
  document.getElementById('shopMoney').textContent = '$' + G.save.money;
  const box = document.getElementById('upgrades');
  box.innerHTML = '';
  UP_DEFS.forEach(u => {
    const lvl = G.save.up[u.key];
    const row = document.createElement('div');
    row.className = 'upRow';
    let pips = '';
    for (let j = 1; j <= 5; j++) pips += `<div class="pip${j <= lvl ? ' f' : ''}"></div>`;
    const maxed = lvl >= 5;
    const cost = maxed ? 0 : UP_COSTS[lvl];
    row.innerHTML = `<div class="nm">${u.icon} ${u.name}</div><div class="pips">${pips}</div>
      <button class="btn small" ${maxed || G.save.money < cost ? 'disabled' : ''}>
        ${maxed ? 'MÁX' : '$' + cost}</button>`;
    row.querySelector('button').addEventListener('click', () => {
      if (G.save.money >= cost && !maxed) {
        G.save.money -= cost;
        G.save.up[u.key]++;
        Store.save(G.save);
        AudioFX.beep(700, 0.12, 0.15);
        buildShop();
      }
    });
    box.appendChild(row);
  });
}

/* ----- Botones de pantallas ----- */
document.getElementById('bNew').addEventListener('click', () => {
  AudioFX.unlock();
  G.save = defaultSave();
  Store.save(G.save);
  G.selCar = 0;
  buildCarCards();
  G.state = 'cars';
  show('scrCars');
});
document.getElementById('bCont').addEventListener('click', () => {
  AudioFX.unlock();
  G.selCar = G.save.car || 0;
  buildCarCards();
  G.state = 'cars';
  show('scrCars');
});
document.getElementById('bWipe').addEventListener('click', () => {
  Store.wipe();
  G.save = defaultSave();
  G.hasSave = false;
  document.getElementById('bCont').style.display = 'none';
  document.getElementById('bWipe').style.display = 'none';
});
document.getElementById('bRace').addEventListener('click', startRace);
document.getElementById('bShop').addEventListener('click', () => {
  buildShop();
  G.state = 'shop';
  show('scrShop');
});
document.getElementById('bNext').addEventListener('click', () => {
  G.selCar = G.save.car;
  buildCarCards();
  G.state = 'cars';
  show('scrCars');
});
document.getElementById('muteBtn').addEventListener('click', e => {
  AudioFX.unlock();
  AudioFX.setMute(!AudioFX.muted);
  e.target.textContent = AudioFX.muted ? '🔇' : '🔊';
});

/* ----- Volver al menú principal (y salir de pantalla completa) ----- */
function goToMenu() {
  G.paused = false;
  AudioFX.stopEngine();
  document.getElementById('touchUI').classList.remove('on');
  document.getElementById('pauseBtn').classList.remove('on');
  document.getElementById('homeBtn').classList.remove('on');
  if (document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }
  // refrescar CONTINUAR / borrar progreso según haya partida guardada
  const has = !!Store.load();
  document.getElementById('bCont').style.display = has ? '' : 'none';
  document.getElementById('bWipe').style.display = has ? '' : 'none';
  G.state = 'title';
  show('scrTitle');
  if (!G.race || !G.race.attract) startAttract();
}
document.getElementById('homeBtn').addEventListener('click', goToMenu);
document.getElementById('bMenuCars').addEventListener('click', goToMenu);
document.getElementById('bMenuRes').addEventListener('click', goToMenu);
document.getElementById('bMenuShop').addEventListener('click', goToMenu);

/* ----- Pausa ----- */
function setPause(on) {
  if (G.state !== 'race') return;
  G.paused = on;
  show(on ? 'scrPause' : null);
  if (on) { AudioFX.engine(0, false); AudioFX.skid(0); }
}
document.getElementById('pauseBtn').addEventListener('click', () => setPause(true));
document.getElementById('bResume').addEventListener('click', () => setPause(false));
document.getElementById('bQuit').addEventListener('click', goToMenu);
addEventListener('keydown', e => {
  if ((e.code === 'KeyP' || e.code === 'Escape') && G.state === 'race') setPause(!G.paused);
});
if (G.hasSave) {
  document.getElementById('bCont').style.display = '';
  document.getElementById('bWipe').style.display = '';
}

/* ---------------- Ajuste de tamaño ---------------- */
function resize() {
  const W = innerWidth, H = innerHeight, ar = 1280 / 720;
  let w = W, h = W / ar;
  if (h > H) { h = H; w = H * ar; }
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 250));
resize();

/* ---------------- Bucle principal (60 FPS, paso fijo) ---------------- */
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1; // evita saltos al volver de segundo plano
  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps < 4) {
    Input.update();
    if (G.race && !G.paused) G.race.update(STEP);
    acc -= STEP; steps++;
  }
  if (G.race) {
    G.race.draw(ctx);
    if (G.state === 'race' && G.race.over && G.race.overT > 2.2) endRace();
  } else {
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(0, 0, 1280, 720);
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    AudioFX.engine(0, false);
    AudioFX.skid(0);
    // pausa automática al salir de la app en plena carrera
    if (G.state === 'race' && !G.paused && G.race && !G.race.over) setPause(true);
  }
});
document.addEventListener('fullscreenchange', () => setTimeout(resize, 100));

Input.init();
startAttract();
requestAnimationFrame(loop);
</script>
</body>
